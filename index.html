<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102d46"><title>自衛消防技術試験対策</title><style>*{box-sizing:border-box}body{margin:0;background:#edf2f7;color:#142c40;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}main{max-width:680px;margin:auto;padding:16px}header{background:#102d46;color:#fff;padding:26px 20px;border-radius:18px}h1{font-size:23px;margin:6px 0}h2{font-size:20px}button{font:inherit;cursor:pointer;border:1px solid #cbd5e1;border-radius:12px;padding:15px;background:#fff;color:#15334b;width:100%;text-align:left;margin:5px 0}button:disabled{opacity:.75;cursor:default}.primary{background:#0c6982;color:#fff;text-align:center;border:0;font-weight:700}.card{background:#fff;padding:19px;border-radius:17px;margin-top:15px;box-shadow:0 2px 12px #142c4010}.muted,small{color:#64748b}.correct{background:#e2f7e9;border-color:#339663}.incorrect{background:#ffece9;border-color:#d76c61}.progress{height:7px;background:#e1e7ed;border-radius:10px;overflow:hidden}.progress div{height:100%;background:#0c6982}textarea{width:100%;min-height:125px;border:1px solid #cbd5e1;border-radius:12px;padding:12px;font:inherit}footer{padding:18px 3px;font-size:12px;color:#617184}a{color:#0c6982}</style></head><body><main><header><div>東京都・東京消防庁 対応学習</div><h1>自衛消防技術試験対策</h1><div>筆記試験 ／ 集合実技</div></header><div id="app"></div><footer>本アプリは非公式の学習用試作版です。問題・模範解答は独自作成で、公式問題・採点基準ではありません。試験制度・法令の最新情報は東京消防庁の公式資料をご確認ください。<p><a href="https://www.tfd.metro.tokyo.lg.jp/" target="_blank" rel="noopener">東京消防庁公式サイト</a></p></footer></main><script>
const W=[
{c:"基礎",q:"燃焼の三要素に含まれないものはどれか。",a:["可燃物","酸素供給源","熱源","二酸化炭素"],k:3,e:"燃焼の三要素は可燃物・酸素供給源・熱源です。二酸化炭素は一般に酸素供給を妨げる消火方法で用いられます。"},
{c:"基礎",q:"窒息消火の原理として正しいものはどれか。",a:["酸素供給を遮断する","温度を下げる","可燃物を移動する","熱を加える"],k:0,e:"窒息消火は燃焼に必要な酸素の供給を抑えます。温度を下げるのは冷却消火です。"},
{c:"基礎",q:"冷却消火の原理として正しいものはどれか。",a:["酸素を増やす","可燃物の温度を下げる","可燃物を追加する","煙を増やす"],k:1,e:"冷却消火は燃焼物の温度を下げ、燃焼を継続しにくくします。"},
{c:"基礎",q:"大きな地震の揺れを感じた際、最初に重視すべきことはどれか。",a:["エレベーターで移動","窓際に移動","落下物などから身を守る","直ちに屋外へ飛び出す"],k:2,e:"まず身の安全を確保します。落下物・転倒物・ガラスの破片などに注意します。"},
{c:"実務",q:"自動火災報知設備の主な役割はどれか。",a:["自動で全て消火する","火災を感知し警報する","全ての煙を排出する","避難階段を増やす"],k:1,e:"自動火災報知設備は感知器等で火災を感知し、警報を発します。自動消火設備とは異なります。"},
{c:"実務",q:"火災を発見した際の対応として適切なものはどれか。",a:["消火完了後に通報する","責任者が来るまで待つ","周囲に知らせ通報・初期消火・避難誘導を状況に応じ実施する","物品の搬出を最優先する"],k:2,e:"周囲への周知、119番通報、初期消火、避難誘導を適切に行い、危険な場合は安全確保と避難を優先します。"},
{c:"実務",q:"防火戸の管理として適切なものはどれか。",a:["閉鎖の妨げとなる物を置かない","荷物で開放固定する","閉鎖装置を外す","扉の前に資材を積む"],k:0,e:"防火戸が閉まらないと炎や煙が広がるおそれがあります。閉鎖障害を防ぐことが重要です。"},
{c:"実務",q:"避難通路の維持管理として適切なものはどれか。",a:["通路に資材を保管する","誘導灯を隠す","避難経路に障害物を置かない","避難口を使用不能にする"],k:2,e:"避難経路を常に安全に使用できるよう、障害物を置かないことが基本です。"},
{c:"法令",q:"消防法の目的に含まれるものはどれか。",a:["火災の予防・警戒・鎮圧等","所得税の徴収","運賃の決定","商品価格の統制"],k:0,e:"消防法第1条は火災の予防・警戒・鎮圧等による生命・身体・財産の保護などを目的としています。"},
{c:"法令",q:"一定の防火対象物の防火管理について正しいものはどれか。",a:["防火管理者の選任は一律不要","管理権原者が防火管理者を選任する","消防計画は一切不要","訓練は常に禁止"],k:1,e:"消防法第8条では、一定の防火対象物について管理権原者による防火管理者の選任等を定めています。適用条件は用途や収容人員等で異なります。"}
];
const P=[
{q:"火災を発見した際の自衛消防活動の主な初動対応を説明してください。",a:"周囲に火災を知らせ、119番通報、初期消火、避難誘導、関係者への連絡を状況に応じて実施する。活動者の安全を優先する。",p:"周知・通報・初期消火・避難誘導・安全確保"},
{q:"屋内消火栓を使用する前に注意すべき事項を説明してください。",a:"火災の状況と退路、周囲の安全、設備の型式、ホースの延長経路や操作体制などを確認し、設備に適した手順で操作する。",p:"退路・安全・設備の型式・操作手順"},
{q:"火災時の避難誘導で注意すべき点を説明してください。",a:"煙の状況を確認し、安全な経路へ誘導する。エレベーターの使用を避け、逃げ遅れや避難に支援を要する人に配慮する。",p:"煙・安全な経路・要配慮者・逃げ遅れ"}
];let mode="",items=[],index=0,score=0;const root=document.getElementById("app");function button(t,f,cl=""){return '<button class="'+cl+'" onclick="'+f+'">'+t+'</button>'}function home(){root.innerHTML='<div class="card"><h2>学習する試験を選択</h2>'+button("📘 筆記試験　4択・解説付き","menu('w')")+button("🧯 集合実技　記述式・模範解答付き","menu('p')")+'<p class="muted">試作版：筆記10問、集合実技3問。300問版・本番25問模試は未実装です。</p></div>'}function menu(m){mode=m;root.innerHTML='<div class="card">'+button("← トップへ","home()")+'<h2>'+(m==="w"?"筆記試験":"集合実技")+'</h2>'+(m==="w"?button("全分野 10問","start('all')")+button("火災・地震の基礎 4問","start('基礎')")+button("自衛消防業務 4問","start('実務')")+button("消防関係法令 2問","start('法令')")+button("間違えた問題を復習","retry()"):button("記述問題 3問","start('all')"))+'</div>'}function retry(){let ids=JSON.parse(localStorage.getItem("fireExamWrong")||"[]");if(!ids.length){alert("復習対象はありません");return}items=ids.map(i=>W[i]);index=0;score=0;show()}function start(cat){items=mode==="w"?W.filter(x=>cat==="all"||x.c===cat):P;index=0;score=0;show()}function show(){if(index>=items.length){root.innerHTML='<div class="card"><h2>学習完了</h2><h1>'+score+' / '+items.length+'</h1><p class="muted">集合実技は自己評価の結果です。</p>'+button("別の問題を解く","menu(mode)","primary")+button("トップへ","home()")+'</div>';return}const q=items[index];root.innerHTML='<div class="card">'+button("← 学習メニュー","menu(mode)")+'<p class="muted">第'+(index+1)+'問 / '+items.length+'問</p><div class="progress"><div style="width:'+100*index/items.length+'%"></div></div><h2>'+q.q+'</h2><div id="choices"></div><div id="result"></div></div>';if(mode==="w"){document.getElementById("choices").innerHTML=q.a.map((x,i)=>button("ABCD"[i]+". "+x,"choose("+i+")")).join("")}else document.getElementById("choices").innerHTML='<textarea placeholder="ここに自分の解答を入力してください" aria-label="記述解答"></textarea>'+button("模範解答を見る","reveal()","primary")}function choose(i){const q=items[index],ok=i===q.k;if(ok)score++;else{let id=W.indexOf(q),a=JSON.parse(localStorage.getItem("fireExamWrong")||"[]");if(id>=0&&!a.includes(id)){a.push(id);localStorage.setItem("fireExamWrong",JSON.stringify(a))}}document.getElementById("choices").innerHTML=q.a.map((x,j)=>'<button disabled class="'+(j===q.k?"correct":j===i?"incorrect":"")+'">'+"ABCD"[j]+". "+x+'</button>').join("");document.getElementById("result").innerHTML='<div class="card '+(ok?"correct":"incorrect")+'"><b>'+(ok?"正解":"不正解　正解："+ "ABCD"[q.k])+'</b><p>'+q.e+'</p></div>'+button("次の問題へ →","next()","primary")}function reveal(){const q=items[index];document.getElementById("result").innerHTML='<div class="card correct"><b>模範解答例</b><p>'+q.a+'</p><b>確認ポイント</b><p>'+q.p+'</p><small>公式の採点基準ではありません。</small></div>'+button("理解できた","mark(true)","primary")+button("復習が必要","mark(false)")}function mark(ok){if(ok)score++;next()}function next(){index++;show()}home();
</script></body></html>
