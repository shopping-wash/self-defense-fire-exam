];P.push(...[{"q":"119番通報時に伝える事項を説明してください。","a":"所在地、建物名、出火場所、燃えている物、逃げ遅れや負傷者の有無などを伝える。","p":"所在地・出火状況・逃げ遅れ"},{"q":"消火器使用時の安全上の注意を説明してください。","a":"適応火災を確認し、退路を確保する。煙や炎が強ければ無理せず避難する。","p":"適応火災・退路・撤退"},{"q":"自動火災報知設備が作動した際の初動を説明してください。","a":"受信機で警戒区域を確認し、安全に配慮して現場を確認する。火災なら周知、通報、避難誘導等を行う。","p":"受信機・現場確認・通報"},{"q":"防火戸と防火シャッターの日常管理を説明してください。","a":"閉鎖や降下を妨げる物を置かず、異常があれば報告し是正する。","p":"閉鎖障害防止・異常報告"},{"q":"避難経路の日常点検事項を説明してください。","a":"廊下や階段、避難口に障害物がなく、扉や誘導灯が適切に使えることを確認する。","p":"通路・扉・誘導灯"},{"q":"初期消火を中止すべき状況を説明してください。","a":"炎や煙が拡大して退路や安全を確保できない場合は消火を中止し避難する。","p":"火勢・煙・退路"},{"q":"避難に支援が必要な人への対応を説明してください。","a":"本人の状況に応じて声掛けと支援を行い、必要に応じて位置や状況を消防隊へ伝える。","p":"声掛け・支援・情報共有"},{"q":"消防隊到着時に伝える情報を説明してください。","a":"出火場所、延焼状況、逃げ遅れ、危険物、避難状況などを伝える。","p":"出火場所・逃げ遅れ・危険物"},{"q":"地震発生直後の自衛消防活動を説明してください。","a":"身の安全を確保し、負傷者や出火、建物の被害を確認して必要な通報・避難誘導を行う。","p":"安全確保・被害確認"},{"q":"非常放送による避難案内の注意点を説明してください。","a":"火災の状況と避難方向を落ち着いて簡潔に伝え、混乱を防ぐ。","p":"明確・簡潔・落ち着いた案内"},{"q":"屋内消火栓の使用時に退路を確認する理由を説明してください。","a":"火勢や煙が拡大したときに安全に撤退できるようにするため。","p":"退路・火勢・安全"},{"q":"自衛消防隊の役割分担で重要なことを説明してください。","a":"出火状況を共有し、通報・初期消火・避難誘導などの担当を明確にする。","p":"情報共有・役割分担"}]);let mode="",items=[],index=0,score=0;const root=document.getElementById("app");function button(t,f,cl=""){return '<button class="'+cl+'" onclick="'+f+'">'+t+'</button>'}function home(){root.innerHTML='<div class="card"><h2>学習する試験を選択</h2>'+button("📘 筆記試験　4択・解説付き","menu('w')")+button("🧯 集合実技　記述式・模範解答付き","menu('p')")+'<p class="muted">収録：筆記'+W.length+'問、集合実技'+P.length+'問。非公式の独自作成問題です。</p></div>'}function menu(m){mode=m;root.innerHTML='<div class="card">'+button("← トップへ","home()")+'<h2>'+(m==="w"?"筆記試験":"集合実技")+'</h2>'+(m==="w"?button("全分野 "+W.length+"問","start('all')")+button("火災・地震の基礎 "+W.filter(x=>x.c==="基礎").length+"問","start('基礎')")+button("自衛消防業務 "+W.filter(x=>x.c==="実務").length+"問","start('実務')")+button("消防関係法令 "+W.filter(x=>x.c==="法令").length+"問","start('法令')")+button("25問ランダム演習","mock()")+button("間違えた問題を復習","retry()"):button("記述問題 "+P.length+"問","start('all')"))+'</div>'}function mock(){mode='w';items=[...W].sort(()=>Math.random()-.5).slice(0,25);index=0;score=0;show()}function retry(){let ids=JSON.parse(localStorage.getItem("fireExamWrong")||"[]");if(!ids.length){alert("復習対象はありません");return}items=ids.map(i=>W[i]);index=0;score=0;show()}function start(cat){items=mode==="w"?W.filter(x=>cat==="all"||x.c===cat):P;index=0;score=0;show()}function show(){if(index>=items.length){root.innerHTML='<div class="card"><h2>学習完了</h2><h1>'+score+' / '+items.length+'</h1><p class="muted">集合実技は自己評価の結果です。</p>'+button("別の問題を解く","menu(mode)","primary")+button("トップへ","home()")+'</div>';return}const q=items[index];root.innerHTML='<div class="card">'+button("← 学習メニュー","menu(mode)")+'<p class="muted">第'+(index+1)+'問 / '+items.length+'問</p><div class="progress"><div style="width:'+100*index/items.length+'%"></div></div><h2>'+q.q+'</h2><div id="choices"></div><div id="result"></div></div>';if(mode==="w"){document.getElementById("choices").innerHTML=q.a.map((x,i)=>button("ABCD"[i]+". "+x,"choose("+i+")")).join("")}else document.getElementById("choices").innerHTML='<textarea placeholder="ここに自分の解答を入力してください" aria-label="記述解答"></textarea>'+button("模範解答を見る","reveal()","primary")}function choose(i){const q=items[index],ok=i===q.k;if(ok)score++;else{let id=W.indexOf(q),a=JSON.parse(localStorage.getItem("fireExamWrong")||"[]");if(id>=0&&!a.includes(id)){a.push(id);localStorage.setItem("fireExamWrong",JSON.stringify(a))}}document.getElementById("choices").innerHTML=q.a.map((x,j)=>'<button disabled class="'+(j===q.k?"correct":j===i?"incorrect":"")+'">'+"ABCD"[j]+". "+x+'</button>').join("");document.getElementById("result").innerHTML='<div class="card '+(ok?"correct":"incorrect")+'"><b>'+(ok?"正解":"不正解　正解："+ "ABCD"[q.k])+'</b><p>'+q.e+'</p></div>'+button("次の問題へ →","next()","primary")}function reveal(){const q=items[index];document.getElementById("result").innerHTML='<div class="card correct"><b>模範解答例</b><p>'+q.a+'</p><b>確認ポイント</b><p>'+q.p+'</p><small>公式の採点基準ではありません。</small></div>'+button("理解できた","mark(true)","primary")+button("復習が必要","mark(false)")}function mark(ok){if(ok)score++;next()}function next(){index++;show()}home();
