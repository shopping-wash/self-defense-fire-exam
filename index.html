v class="card"><h2>学習する試験を選択</h2><button onclick="menu('w')">📘 筆記試験　4択・解説付き</button><button onclick="menu('p')">🧯 集合実技　記述式・模範解答付き</button></div></div><footer>本アプリは非公式の学習用試作版です。問題・模範解答は独自作成で、公式問題・採点基準ではありません。試験制度・法令の最新情報は東京消防庁の公式資料をご確認ください。<p><a href="https://www.tfd.metro.tokyo.lg.jp/" target="_blank" rel="noopener">東京消防庁公式サイト</a></p></footer></main><script>

const WOFFICIAL=[{"c":"基礎","q":"消火方法と主な作用の組合せのうち、誤っているものはどれか。","a":["水による放水―冷却","可燃物の撤去―除去","二酸化炭素の放出―窒息","空気供給の遮断―冷却"],"k":3,"e":"空気の供給を断つ方法は窒息消火です。冷却は温度を下げる作用です。（参考：東京消防庁公開過去問題・関連法令）","source":"https://www.tfd.metro.tokyo.lg.jp/content/000021182.pdf"},{"c":"基礎","q":"静電気の発生・蓄積に関する記述のうち、適切でないものはどれか。","a":["液体の流動や摩擦でも帯電することがある","接地は帯電防止に有効な場合がある","乾燥時は帯電しやすい","湿度が高いほど一般に帯電しやすい"],"k":3,"e":"一般に乾燥時は静電気が蓄積しやすくなります。（参考：東京消防庁公開過去問題・関連法令）","source":"https://www.tfd.metro.tokyo.lg.jp/content/000021182.pdf"},{"c":"基礎","q":"液体が気体に変わる際に周囲から吸収する熱はどれか。","a":["燃焼熱","凝固熱","気化熱","生成熱"],"k":2,"e":"液体が蒸発するときに吸収する熱を気化熱といいます。（参考：東京消防庁公開過去問題・関連法令）","source":"https://www.tfd.metro.tokyo.lg.jp/content/000021182.pdf"},{"c":"基礎","q":"消防法上の危険物の分類について、正しいものはどれか。","a":["ガソリンは第4類の引火性液体に該当する","硝酸は第4類引火性液体である","軽油は第1類酸化性固体である","動植物油類は危険物に一切含まれない"],"k":0,"e":"ガソリン・軽油・動植物油類などは条件に応じ第4類危険物です。硝酸は第6類です。（参考：東京消防庁公開過去問題・関連法令）","source":"https://www.tfd.metro.tokyo.lg.jp/content/000021182.pdf"},{"c":"基礎","q":"防火材料を不燃性能の高い順に並べたものはどれか。","a":["難燃・準不燃・不燃","準不燃・不燃・難燃","不燃・準不燃・難燃","不燃・難燃・準不燃"],"k":2,"e":"一般的な区分は不燃材料、準不燃材料、難燃材料の順です。（参考：東京消防庁公開過去問題・関連法令）","source":"https://www.tfd.metro.tokyo.lg.jp/content/000021182.pdf"},{"c":"基礎","q":"地震の震度について正しい説明はどれか。","a":["マグニチュードは各地点の揺れの強さ","震度は観測地点ごとの揺れの強さ","震度は全国一律に同じ","長周期地震動は高層建築物に影響しない"],"k":1,"e":"震度は観測地点での揺れの強さを表し、マグニチュードは地震の規模です。（参考：東京消防庁公開過去問題・関連法令）","source":"https://www.tfd.metro.tokyo.lg.jp/content/000021182.pdf"},{"c":"法令","q":"防火管理者の業務と危険物取扱者の業務の区別として適切なのはどれか。","a":["防火管理者は消防計画作成や訓練等を行う","防火管理者は全危険物の取扱立会いを独占する","危険物取扱者は消防計画を必ず作成する","防火管理者は火気使用の監督を行わない"],"k":0,"e":"消防計画や訓練は防火管理者の業務です。危険物取扱いの立会いには別の資格制度があります。（参考：東京消防庁公開過去問題・関連法令）","source":"https://www.tfd.metro.tokyo.lg.jp/content/000021182.pdf"},{"c":"法令","q":"消防法上の火災発見時の通報について適切なのはどれか。","a":["上司の許可がなければ通報できない","初期消火に成功すれば通報不要","火災を発見した者は遅滞なく消防機関に通報する","延焼規模が確定するまで通報を待つ"],"k":2,"e":"消防法第24条は火災発見者の通報義務を定めています。（参考：東京消防庁公開過去問題・関連法令）","source":"https://www.tfd.metro.tokyo.lg.jp/content/000021182.pdf"},{"c":"法令","q":"自衛消防活動中核要員の装備に関する説明として適切なのはどれか。","a":["消防用ヘルメット等の個人装備が条例上定められている","全員に空気呼吸器の携行が一律義務","装備の基準は道路交通法だけで定める","携帯用照明器具は火災時に不要"],"k":0,"e":"東京都火災予防条例の規定に基づき中核要員の装備が定められています。具体的要件は最新条文を確認してください。（参考：東京消防庁公開過去問題・関連法令）","source":"https://www.tfd.metro.tokyo.lg.jp/content/000021182.pdf"},{"c":"実務","q":"スプリンクラー設備の維持管理で不適切な行動はどれか。","a":["散水障害となる荷物を移動する","制御弁が開いているのを見て理由なく閉める","制御弁の表示を見やすくする","異常があれば管理者に報告する"],"k":1,"e":"制御弁を不用意に閉鎖すると散水機能が失われます。（参考：東京消防庁公開過去問題・関連法令）","source":"https://www.tfd.metro.tokyo.lg.jp/content/000021182.pdf"},{"c":"実務","q":"自動火災報知設備の受信機が作動した際の対応で適切なのはどれか。","a":["複数地区の表示だけで火災を断定する","地区音響を停止したまま現場確認を省略する","地区表示と警戒区域図を照合し現場を確認する","受信機の電源を切ってから調査する"],"k":2,"e":"表示区域を確認して安全に現場を調べ、火災なら必要な通報や避難対応を行います。（参考：東京消防庁公開過去問題・関連法令）","source":"https://www.tfd.metro.tokyo.lg.jp/content/000021182.pdf"},{"c":"実務","q":"屋内消火栓設備の加圧送水装置に関して適切なのはどれか。","a":["起動方式はすべて同一である","表示灯の変化は設備状態を示す場合がある","設備の型式確認は不要","放水時にホースの折れは問題ない"],"k":1,"e":"加圧送水装置の起動や表示は設備の型式によって異なり、取扱要領の確認が必要です。（参考：東京消防庁公開過去問題・関連法令）","source":"https://www.tfd.metro.tokyo.lg.jp/content/000021182.pdf"},{"c":"実務","q":"火災時に防火戸を閉鎖する際の適切な対応はどれか。","a":["避難者の動線を確認し誘導員と連携する","避難者の有無に関係なく閉鎖する","防火戸は常に開放固定する","煙感知器との連動を解除する"],"k":0,"e":"閉鎖時には避難者の安全と防火区画の機能を両立させます。（参考：東京消防庁公開過去問題・関連法令）","source":"https://www.tfd.metro.tokyo.lg.jp/content/000021182.pdf"},{"c":"実務","q":"AEDによる電気ショックの要否について正しいのはどれか。","a":["救助者が心電図を目視して決定する","AEDが解析して音声等で指示する","救急隊到着まで絶対に使用しない","電極パッドは衣服の上から貼る"],"k":1,"e":"AEDは心電図を解析し電気ショックの必要性を判断します。（参考：東京消防庁公開過去問題・関連法令）","source":"https://www.tfd.metro.tokyo.lg.jp/content/000021182.pdf"},{"c":"実務","q":"防災センターで消防隊へ引き継ぐ事項として適切なのはどれか。","a":["設備の操作状況や避難状況を整理して伝える","消防隊の活動に必要な図面は隠す","受信機の表示履歴は必ず消去する","消防隊が来たら無条件に全員退室する"],"k":0,"e":"出火場所・設備操作・避難状況等を消防隊に引き継ぎます。（参考：東京消防庁公開過去問題・関連法令）","source":"https://www.tfd.metro.tokyo.lg.jp/content/000021182.pdf"}];
const VERIFIED=[{"c":"基礎","q":"燃焼に必要な条件の組合せはどれか。","a":["熱源と酸素","光と窒素","熱源と二酸化炭素","光と二酸化炭素"],"k":0,"e":"燃焼には可燃物、酸素供給源、熱源が必要です。","source":"https://www.tfd.metro.tokyo.lg.jp/content/000021182.pdf","officialRef":1},{"c":"基礎","q":"消火方法と効果の組合せで誤っているものはどれか。","a":["水―冷却","可燃物の除去―除去","二酸化炭素―窒息","空気の遮断―抑制"],"k":3,"e":"空気の供給を遮断するのは窒息効果です。","source":"https://www.tfd.metro.tokyo.lg.jp/content/000021182.pdf","officialRef":2},{"c":"基礎","q":"液体が蒸発するときに吸収する熱はどれか。","a":["燃焼熱","溶解熱","気化熱","生成熱"],"k":2,"e":"液体から気体への状態変化で吸収される熱は気化熱です。","source":"https://www.tfd.metro.tokyo.lg.jp/content/000021182.pdf","officialRef":3},{"c":"基礎","q":"次のうち第4類危険物の引火性液体に該当しないものはどれか。","a":["軽油","メタノール","硝酸","動植物油類"],"k":2,"e":"硝酸は第6類の酸化性液体です。","source":"https://www.tfd.metro.tokyo.lg.jp/content/000021182.pdf","officialRef":4},{"c":"基礎","q":"静電気について誤っている記述はどれか。","a":["合成繊維は摩擦で帯電しやすい","液体の流動でも帯電する","湿度が高いほど静電気が蓄積しやすい","接地は帯電防止に有効"],"k":2,"e":"一般に乾燥時に帯電しやすくなります。","source":"https://www.tfd.metro.tokyo.lg.jp/content/000021182.pdf","officialRef":5},{"c":"基礎","q":"火災時の煙について不適切な説明はどれか。","a":["一酸化炭素を含むことがある","低い姿勢で避難することが有効な場合がある","天井付近から広がることがある","煙は横方向の拡散が縦方向の上昇より常に速い"],"k":3,"e":"煙は高温のため上昇し、縦方向への拡散が速い場合があります。","source":"https://www.tfd.metro.tokyo.lg.jp/content/000021182.pdf","officialRef":6},{"c":"基礎","q":"非常用照明装置の説明で誤っているものはどれか。","a":["避難のために必要な照度を確保する","主に消防隊の消火活動を容易にするための設備である","予備電源に切り替わるものがある","避難を容易にする目的がある"],"k":1,"e":"非常用照明装置は主に避難時の照度確保を目的とします。","source":"https://www.tfd.metro.tokyo.lg.jp/content/000021182.pdf","officialRef":7},{"c":"基礎","q":"防火戸の説明で誤っているものはどれか。","a":["常時閉鎖式と随時閉鎖式がある","特定防火設備と防火設備の区分がある","延焼や煙の拡大を抑える","煙感知器に連動して閉鎖した防火戸は手で開けられない"],"k":3,"e":"避難のために手動開放できる構造の防火戸があります。","source":"https://www.tfd.metro.tokyo.lg.jp/content/000021182.pdf","officialRef":8},{"c":"基礎","q":"防火材料を不燃性能の高い順に並べたものはどれか。","a":["不燃・準不燃・難燃","難燃・不燃・準不燃","準不燃・不燃・難燃","不燃・難燃・準不燃"],"k":0,"e":"不燃材料、準不燃材料、難燃材料の順です。","source":"https://www.tfd.metro.tokyo.lg.jp/content/000021182.pdf","officialRef":9},{"c":"基礎","q":"震度について正しい説明はどれか。 ];P.push(...[{"q":"119番通報時に伝える事項を説明してください。","a":"所在地、建物名、出火場所、燃えている物、逃げ遅れや負傷者の有無などを伝える。","p":"所在地・出火状況・逃げ遅れ"},{"q":"消火器使用時の安全上の注意を説明してください。","a":"適応火災を確認し、退路を確保する。煙や炎が強ければ無理せず避難する。","p":"適応火災・退路・撤退"},{"q":"自動火災報知設備が作動した際の初動を説明してください。","a":"受信機で警戒区域を確認し、安全に配慮して現場を確認する。火災なら周知、通報、避難誘導等を行う。","p":"受信機・現場確認・通報"},{"q":"防火戸と防火シャッターの日常管理を説明してください。","a":"閉鎖や降下を妨げる物を置かず、異常があれば報告し是正する。","p":"閉鎖障害防止・異常報告"},{"q":"避難経路の日常点検事項を説明してください。","a":"廊下や階段、避難口に障害物がなく、扉や誘導灯が適切に使えることを確認する。","p":"通路・扉・誘導灯"},{"q":"初期消火を中止すべき状況を説明してください。","a":"炎や煙が拡大して退路や安全を確保できない場合は消火を中止し避難する。","p":"火勢・煙・退路"},{"q":"避難に支援が必要な人への対応を説明してください。","a":"本人の状況に応じて声掛けと支援を行い、必要に応じて位置や状況を消防隊へ伝える。","p":"声掛け・支援・情報共有"},{"q":"消防隊到着時に伝える情報を説明してください。","a":"出火場所、延焼状況、逃げ遅れ、危険物、避難状況などを伝える。","p":"出火場所・逃げ遅れ・危険物"},{"q":"地震発生直後の自衛消防活動を説明してください。","a":"身の安全を確保し、負傷者や出火、建物の被害を確認して必要な通報・避難誘導を行う。","p":"安全確保・被害確認"},{"q":"非常放送による避難案内の注意点を説明してください。","a":"火災の状況と避難方向を落ち着いて簡潔に伝え、混乱を防ぐ。","p":"明確・簡潔・落ち着いた案内"},{"q":"屋内消火栓の使用時に退路を確認する理由を説明してください。","a":"火勢や煙が拡大したときに安全に撤退できるようにするため。","p":"退路・火勢・安全"},{"q":"自衛消防隊の役割分担で重要なことを説明してください。","a":"出火状況を共有し、通報・初期消火・避難誘導などの担当を明確にする。","p":"情報共有・役割分担"}]);let mode="",items=[],index=0,score=0;const root=document.getElementById("app");function button(t,f,cl=""){return '<button class="'+cl+'" onclick="'+f+'">'+t+'</button>'}function home(){root.innerHTML='<div class="card"><h2>学習する試験を選択</h2>'+button("📘 筆記試験　4択・解説付き","menu('w')")+button("🧯 集合実技　記述式・模範解答付き","menu('p')")+'<p class="muted">写真の目次に合わせて筆記5単元に分類しました。問題数・難易度は引き続き拡充・検証が必要です。</p></div>'}const UNITS=[["火災に関する基礎知識｜燃焼・消火・火災現象","fire"],["火災に関する基礎知識｜防火対象物の防火防災対策","building"],["消防関係法令","law"],["自衛消防業務｜自衛消防活動","activity"],["自衛消防業務｜消防用設備等の維持管理・取扱要領","equipment"]];function unitOf(q){const t=q.q;if(q.c==="法令")return "law";if(/静電気|燃焼|消火方法|消火作用|気化熱|蒸発|危険物|硝酸|ガソリン|火災時の煙|震度|地震の震度|マグニチュード/.test(t))return "fire";if(/防火材料|防火戸の説明|防火材料|非常用照明|防火対象物の自主検査/.test(t))return "building";if(/スプリンクラー|受信機|消火栓|AED|加圧送水|警報設備|自動火災報知|消防用設備/.test(t))return "equipment";if(/防火戸|防火区画|避難経路|防火防災対策/.test(t))return "building";return "activity"}function menu(m){mode=m;root.innerHTML='<div class="card">'+button("← トップへ","home()")+'<h2>'+(m==="w"?"筆記試験｜単元別学習":"集合実技")+'</h2>'+(m==="w"?UNITS.map(([name,id])=>button(name+"（"+HARD.filter(q=>unitOf(q)===id).length+"問）","startUnit('"+id+"')")).join("")+button("全単元 "+HARD.length+"問","hardStart()")+button("25問模擬試験","hardMock()")+button("間違えた問題を復習","retry()"):button("記述問題 "+P.length+"問","start('all')"))+'</div>'}function startUnit(id){mode="w";items=HARD.filter(q=>unitOf(q)===id).sort(()=>Math.random()-.5);index=0;score=0;show()}function hardStart(){mode='w';items=[...HARD].sort(()=>Math.random()-.5);index=0;score=0;show()}function hardMock(){mode='w';const pick=(c,n)=>[...HARD.filter(x=>x.c===c)].sort(()=>Math.random()-.5).slice(0,n);items=[...pick('基礎',10),...pick('実務',10),...pick('法令',5)];index=0;score=0;show()}function retry(){let ids=JSON.parse(localStorage.getItem("fireExamWrong")||"[]");if(!ids.length){alert("復習対象はありません");return}items=ids.map(i=>HARD[i]).filter(Boolean);index=0;score=0;show()}function start(cat){items=mode==="w"?HARD.filter(x=>cat==="all"||x.c===cat):P;index=0;score=0;show()}function show(){if(index>=items.length){root.innerHTML='<div class="card"><h2>学習完了</h2><h1>'+score+' / '+items.length+'</h1><p class="muted">集合実技は自己評価の結果です。</p>'+button("別の問題を解く","menu(mode)","primary")+button("トップへ","home()")+'</div>';return}const q=items[index];root.innerHTML='<div class="card">'+button("← 学習メニュー","menu(mode)")+'<p class="muted">第'+(index+1)+'問 / '+items.length+'問</p><div class="progress"><div style="width:'+100*index/items.length+'%"></div></div><h2>'+q.q+'</h2><div id="choices"></div><div id="result"></div></div>';if(mode==="w"){document.getElementById("choices").innerHTML=q.a.map((x,i)=>button("ABCD"[i]+". "+x,"choose("+i+")")).join("")}else document.getElementById("choices").innerHTML='<textarea placeholder="ここに自分の解答を入力してください" aria-label="記述解答"></textarea>'+button("模範解答を見る","reveal()","primary")}function choose(i){const q=items[index],ok=i===q.k;if(ok)score++;else{let id=HARD.indexOf(q),a=JSON.parse(localStorage.getItem("fireExamWrong")||"[]");if(id>=0&&!a.includes(id)){a.push(id);localStorage.setItem("fireExamWrong",JSON.stringify(a))}}document.getElementById("choices").innerHTML=q.a.map((x,j)=>'<button disabled class="'+(j===q.k?"correct":j===i?"incorrect":"")+'">'+"ABCD"[j]+". "+x+'</button>').join("");document.getElementById("result").innerHTML='<div class="card '+(ok?"correct":"incorrect")+'"><b>'+(ok?"正解":"不正解　正解："+ "ABCD"[q.k])+'</b><p>'+q.e+'</p></div>'+button("次の問題へ →","next()","primary")}function reveal(){const q=items[index];document.getElementById("result").innerHTML='<div class="card correct"><b>模範解答例</b><p>'+q.a+'</p><b>確認ポイント</b><p>'+q.p+'</p><small>公式の採点基準ではありません。</small></div>'+button("理解できた","mark(true)","primary")+button("復習が必要","mark(false)")}function mark(ok){if(ok)score++;next()}function next(){index++;show()}home();if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});}
</script></body></html>
