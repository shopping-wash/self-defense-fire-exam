name: Evidence-gated AI question review
on:
  workflow_dispatch:
    inputs:
      start:
        description: Starting question index
        default: "0"
        required: true
      count:
        description: Questions to review (recommend 20)
        default: "20"
        required: true
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Review questions without modifying live bank
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 review/run_review.py --start "${{ inputs.start }}" --count "${{ inputs.count }}"
      - name: Upload review candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-candidates
          path: review/output/
          if-no-files-found: warn
